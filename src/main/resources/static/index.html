<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Demo Usuarios</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ===================== ROOT ===================== */
        :root{
            --bg:#020617;
            --panel:#0f172a;
            --card:#020617;
            --border:#1e293b;

            --primary:#6366f1;
            --primary-hover:#4f46e5;

            --success:#22c55e;
            --error:#ef4444;

            --text:#e5e7eb;
            --muted:#94a3b8;
        }

        /* ===================== BASE ===================== */
        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            background:linear-gradient(135deg,#020617,#0f172a);
            color:var(--text);
            font-family:"Inter",sans-serif;
        }

        /* ===================== MAIN LAYOUT ===================== */
        .container{
            width:100%;
            max-width:1000px;
            padding:2rem;
        }

        header{
            text-align:center;
            margin-bottom:3rem;
        }

        header h1{
            margin:0;
            font-size:2.5rem;
            letter-spacing:1px;
        }

        header p{
            color:var(--muted);
            margin-top:.3rem;
        }

        /* ===================== GRID ===================== */
        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
            gap:1.7rem;
        }

        /* ===================== PANELS ===================== */
        .panel{
            background:var(--panel);
            border-radius:18px;
            padding:1.5rem;
            border:1px solid var(--border);
            box-shadow:0 15px 40px rgba(0,0,0,.35);
        }

        .panel h2{
            margin:0 0 1rem;
            color:#c7d2fe;
        }

        /* ===================== FORMS ===================== */
        .form-group{
            display:grid;
            gap:.7rem;
        }

        input{
            padding:12px 14px;
            border-radius:12px;
            background:var(--card);
            border:1px solid transparent;
            outline:none;
            color:var(--text);
            transition:.2s;
        }

        input::placeholder{
            color:var(--muted);
        }

        input:focus{
            border-color:var(--primary);
            box-shadow:0 0 12px rgba(99,102,241,.5);
        }

        /* ===================== BUTTONS ===================== */
        button{
            width:100%;
            padding:12px;
            background:linear-gradient(135deg,var(--primary),#818cf8);
            border:none;
            border-radius:12px;
            color:white;
            font-weight:700;
            cursor:pointer;
            letter-spacing:.5px;
            transition:.2s;
        }

        button:hover{
            background:linear-gradient(135deg,var(--primary-hover),#6366f1);
            transform:translateY(-2px);
            box-shadow:0 6px 20px rgba(79,70,229,.4);
        }

        /* ===================== ALERTS ===================== */
        .success{
            color:var(--success);
            font-weight:600;
        }
        .error{
            color:var(--error);
            font-weight:600;
        }

        /* ===================== USERS GRID ===================== */
        #user-list{
            margin-top:1.2rem;
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
            gap:14px;
        }

        /* ===================== CARD ===================== */
        .user-card{
            background:linear-gradient(145deg,#020617,#020617);
            padding:1rem 1.1rem;
            border-radius:16px;
            border:1px solid var(--border);
            box-shadow:0 15px 30px rgba(0,0,0,.4);
            transition:.25s ease;
        }

        .user-card:hover{
            transform:translateY(-4px) scale(1.01);
            box-shadow:0 15px 45px rgba(99,102,241,.25);
        }

        .user-card b{
            color:#c7d2fe;
        }

        /* ===================== SEARCH BOX ===================== */
        .search-box{
            display:flex;
            gap:.7rem;
        }

        .search-box input{
            flex:1;
        }

        .delete-btn{
            margin-top:8px;
            background:linear-gradient(135deg,#ef4444,#dc2626);
            color:white;
            border:none;
            border-radius:10px;
            padding:8px;
            cursor:pointer;
            transition:.2s;
        }

        .delete-btn:hover{
            background:linear-gradient(135deg,#dc2626,#b91c1c);
            transform:scale(1.05);
        }


    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>🔥 Gestión de Contactos</h1>
        <p>Demo frontend + Spring Boot backend</p>
    </header>

    <div class="grid">

        <!-- CREAR -->
        <section class="panel">
            <h2>➕ Crear Contacto</h2>
            <div class="form-group">
                <input id="name" type="text" placeholder="Nombre completo">
                <input id="phone" type="text" placeholder="Teléfono (10 dígitos)">
                <button onclick="createUser()">Crear Usuario</button>
                <p id="create-msg"></p>
            </div>
        </section>

        <!-- BUSCAR -->
        <section class="panel">
            <h2>🔍 Buscar por ID</h2>

            <div class="search-box">
                <input id="userId" type="number" placeholder="ID del usuario">
                <button onclick="getUser()">Buscar</button>
            </div>

            <div id="user-result"></div>
        </section>

    </div>

    <!-- LISTA -->
    <section class="panel" style="margin-top:2rem;">
        <h2>📋 Lista de Contactos</h2>
        <button onclick="loadUsers()">Cargar Usuarios</button>
        <div id="user-list"></div>
    </section>

</div>

<script>
    async function createUser(){
        const name = document.getElementById("name").value;
        const phone = document.getElementById("phone").value;
        const msg = document.getElementById("create-msg");

        msg.innerHTML = "";

        const response = await fetch("/users",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ name, phone })
        });

        const data = await response.json();

        if(!response.ok){
            msg.innerHTML=`<span class="error">${JSON.stringify(data.errors)}</span>`;
        }else{
            msg.innerHTML=`<span class="success">✅ Usuario creado — ID ${data.id}</span>`;

            // 🔥 REFRESCAR LISTA AUTOMÁTICAMENTE
            loadUsers();

            // Limpiar inputs
            document.getElementById("name").value="";
            document.getElementById("phone").value="";
        }
    }


    async function getUser(){
        const id=document.getElementById("userId").value;
        const box=document.getElementById("user-result");

        box.innerHTML="";

        const r=await fetch("/users/"+id);

        if(!r.ok){
            box.innerHTML="<p class='error'>❌ Usuario no encontrado</p>";
            return;
        }

        const u=await r.json();

        box.innerHTML=`
        <div class="user-card">
            <b>ID:</b> ${u.id}<br>
            <b>Nombre:</b> ${u.name}<br>
            <b>Teléfono:</b> ${u.phone}
        </div>
    `;
    }

    async function loadUsers(){
        const list=document.getElementById("user-list");
        list.innerHTML="";

        const r=await fetch("/users");
        const users=await r.json();

        users.forEach(u=>{
            list.innerHTML+=`
        <div class="user-card">
            <b>ID:</b> ${u.id}<br>
            <b>Nombre:</b> ${u.name}<br>
            <b>Teléfono:</b> ${u.phone}<br><br>

            <button class="delete-btn" onclick="deleteUser(${u.id})">
                🗑 Eliminar
            </button>
        </div>
    `;
        });
    }

    async function deleteUser(id){

        if(!confirm("¿Eliminar este usuario?")) return;

        const response = await fetch("/users/" + id, {
            method:"DELETE"
        });

        if(response.ok){
            loadUsers();   // 🔥 RECARGAR LISTA
        } else {
            alert("Error al eliminar");
        }
    }



</script>

</body>
</html>
